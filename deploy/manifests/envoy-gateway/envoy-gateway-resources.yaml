---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
  annotations: {argocd.argoproj.io/sync-wave: "4"}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: eg-system
  annotations: 
  - argocd.argoproj.io/sync-wave: "4"
  - cert-manager.io/cluster-issuer: "cert-manager/cluster-ca-key-pair"
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: eg-tls
            kind: Secret
---