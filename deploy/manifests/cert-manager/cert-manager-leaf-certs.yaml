--- 
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: eg-client
  namespace: cert-manager
  annotations: {argocd.argoproj.io/sync-wave: "10"}
spec:
  commonName: cluster-ca
  secretName: eg-client-tls # <-- the Secret CA-CI refs
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cluster-ca
    kind: ClusterIssuer
    group: cert-manager.io
  usages: 
    - client auth
---