# -- Number of pod replicas (ignored when autoscaling.enabled=true)
replicaCount: 1

image:
  repository: ghcr.io/cdialpha/accounts
  tag: "v1.0"                 # δ to .Chart.AppVersion if empty
  pullPolicy: IfNotPresent   # Always | IfNotPresent | Never

# -- Pod-level annotations (e.g. Prometheus scrape, checksum/config)
podAnnotations: {}

# -- Node scheduling controls
nodeSelector: {}
tolerations: []
affinity: {}

# -- Container resource req/limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Liveness/readiness probes
probes:
  enabled: false
  type: grpc
  port: 50051
  initialDelaySeconds: 10
  periodSeconds: 15

service:
  type: ClusterIP           # ClusterIP | NodePort | LoadBalancer
  port: 80                  # svc-exposed port
  targetPort: 8080          # container listen port

serviceAccount:
  create: true
  annotations: {}           # e.g. IRSA / Workload Identity ARN

# -- HorizontalPodAutoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# -- RBAC role + rules bound to the serviceAccount
rbac:
  create: true
  rules: []
  # - apiGroups: [""]
  #   resources: ["configmaps", "secrets"]
  #   verbs: ["get", "list", "watch"]