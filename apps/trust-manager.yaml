apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
  -  repoURL: https://charts.jetstack.io
     chart: trust-manager
     targetRevision: v0.24.0
     helm:
       valueObject:
         crds:
           enabled: false
         defaultPackage:
           enabled: false
         secretTargets:
           enabled: false
         app:
           trust:
             namespace: cert-manager   
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - Replace=true
      - CreateNamespace=true