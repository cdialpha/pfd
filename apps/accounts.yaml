apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: accounts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade-delete children on root deletion
spec:
  project: default
  source:
    repoURL: https://github.com/cdialpha/pfd
    targetRevision: dev # branch | tag | commit SHA 
    path: deploy/charts/accounts 
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true # allow deletion of resources
      selfHeal: true # allow auto-sync when drift detected
    syncOptions:
      - CreateNamespace=true # auto-create namespace if missing