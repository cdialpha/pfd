apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: oci://docker.io/envoyproxy/gateway-crds-helm
    targetRevision: v1.9.2
    chart: gateway-crds
    helm:
      valuesObject:
        crds:
          gatewayAPI:
            enabled: true
            channel: standard   # δ experimental, pick deliberately
          envoyGateway:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true