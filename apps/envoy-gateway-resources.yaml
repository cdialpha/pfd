apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
      repoURL: https://github.com/cdialpha/pfd/
      path: deploy/manifests/envoy-gateway
      targetRevision: dev
      directory:
        recurse: true
        # include: "*.yaml"
        # exlucde: "{kustomization.yaml, *.md}"
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true